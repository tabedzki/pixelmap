name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:  # Allow manual triggering
  workflow_call:  # docker-publish.yml runs these before it publishes an image
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm reads the version from tags

    # ruff is a standalone binary, so the runner's own Python is enough here.
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3  # no floating major tags since v8
      with:
        version: '0.13.7'  # keep in step with the Dockerfile
        cache-suffix: lint

    # uv.lock pins the ruff version, so CI and local runs check the same rules.
    - name: Lint with ruff
      run: uv run --locked --only-group lint ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm reads the version from tags

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3  # no floating major tags since v8
      with:
        version: '0.13.7'  # keep in step with the Dockerfile
        cache-suffix: test

    # uv takes the Python version from .python-version, as the Dockerfile does,
    # so this tests what ships.
    # --locked installs exactly uv.lock and fails if the lockfile is out of
    # date with pyproject.toml.
    - name: Install dependencies
      run: uv sync --locked

    - name: Run tests with coverage
      run: uv run --locked pytest tests/ -v --cov=pixelmap --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false  # PRs from forks have no token
